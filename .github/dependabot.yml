version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    target-branch: 0.x_beta
    open-pull-requests-limit: 10
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: 0.x_beta
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: 0.x_beta
